[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pumpfun-listener"
version = "0.1.0"
description = "Async Solana blockchain listener for pump.fun events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sniper Bot Team" }]
keywords = ["solana", "pumpfun", "blockchain", "listener", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "orjson>=3.10",
    "solders>=0.21",
    "base58>=2.1",
    "structlog>=24.1",
    "tenacity>=8.2",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pumpfun-listener = "listener.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/listener"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"